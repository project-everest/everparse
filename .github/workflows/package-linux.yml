name: Build everparse package (Linux)
on:
  push:
    branches-ignore:
    - _**
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@master

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2

      - name: Build package
        run: |
          eval $(opam env)
          env OPAMNODEPEXTS=0 make -f package.Makefile everparse -kj$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          path: |
            everparse
          name: everparse

  test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download and extract artifact
        uses: actions/download-artifact@v4
        with:
          name: everparse
          path: ${{ github.workspace }}/test
      - name: Restore permissions
        run: |
          chmod +x ${{ github.workspace }}/test/bin/* ${{ github.workspace }}/test/lib/fstar/z3-*/bin/*
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/3d/tests
            share/everparse/tests/3d
            src/cddl/tests/demo/test.cddl
          path: ${{ github.workspace }}/everparse
      - name: Test EverParse
        run: |
          bash ${{ github.workspace }}/test/everparse.sh --pulse ${{ github.workspace }}/everparse/share/everparse/tests/3d/Arithmetic.3d ${{ github.workspace }}/everparse/share/everparse/tests/3d/FieldDependence0.3d && bash ${{ github.workspace }}/test/everparse.sh --pulse ${{ github.workspace }}/everparse/share/everparse/tests/3d/Comments.3d && bash ${{ github.workspace }}/test/everparse.sh --pulse --check_hashes inplace ${{ github.workspace }}/everparse/share/everparse/tests/3d/Comments.3d
      - name: Test EverParse test case generation
        run: |
          bash ${{ github.workspace }}/test/everparse.sh --pulse ${{ github.workspace }}/everparse/share/everparse/tests/3d/ELFTestGen.3d --odir ${{ github.workspace }}/test-elf-pulse --z3_test ELFTestGen._ELFTestGen --z3_witnesses 10 --z3_branch_depth 5
      - name: Test EverCDDL
        run: |
          ${{ github.workspace }}/test/bin/cddl.exe ${{ github.workspace }}/everparse/src/cddl/tests/demo/test.cddl
