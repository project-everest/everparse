name: Upgrade hashes, 3D doc, CBOR, COSE snapshots
on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a pull request (if unchecked, push directly to branch)'
        type: boolean
        default: true
  schedule:
    - cron: "0 22 * * 0,3"

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  advance-hashes:
    runs-on: Ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - name: Record base ref
        run: |
          echo "base_branch=${{ github.event_name == 'schedule' && 'master' || github.ref_name }}" > base_ref.txt
          echo "base_sha=$(git rev-parse HEAD)" >> base_ref.txt
      - name: Upload base
        uses: actions/upload-artifact@v4
        with:
          path: |
            base_ref.txt
          name: base
      - name: Set up git
        run: |
          git config --global user.name "Dzomo, the Everest Yak"
          git config --global user.email "24394600+dzomo@users.noreply.github.com"
      - name: Advance hashes
        run: |
          make -C opt -j$(nproc) advance &&
          if ! git diff --exit-code -- opt/hashes.Makefile ; then git add -u opt/hashes.Makefile && git commit -m 'Update hashes' ; fi &&
          git diff --exit-code
      - name: Push new branch
        run: |
          git checkout -b _dzomo_upgrade_${{ github.run_id }} &&
          git push origin _dzomo_upgrade_${{ github.run_id }}

  ci-linux:
    needs: advance-hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          submodules: true
          ref: _dzomo_upgrade_${{ github.run_id }}
      - name: Install opam
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends opam
      - name: Set-up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/3d/hashchk/global.json
      - name: Set up git
        run: |
          git config --global user.name "Dzomo, the Everest Yak"
          git config --global user.email "24394600+dzomo@users.noreply.github.com"
      - name: Generate CBOR .krml files
        run: |
          make cbor-extract-krml -kj$(nproc)
      - name: Generate CBOR snapshot with Karamel
        run: |
          make cbor-snapshot -Otarget -kj$(nproc) && make cbor -kj$(nproc)
      - name: Generate COSE .krml files
        run: |
          make cose-extract-krml -kj$(nproc)
      - name: Generate COSE snapshot with Karamel
        run: |
          make cose-snapshot -Otarget -kj$(nproc) && make cose -kj$(nproc)
      - name: Generate 3D doc snapshot
        run: |
          make 3d-doc-snapshot -kj$(nproc)
      - name: Stage in new snapshots
        run: |
          git add doc/3d-snapshot src/cbor/pulse/det/c src/cbor/pulse/nondet/c src/cbor/pulse/det/rust src/cbor/pulse/nondet/rust src/cose/c src/cose/rust &&
          if ! git diff --staged --exit-code ; then git commit -m "3D doc, CBOR, COSE snapshot" ; fi &&
          git diff --exit-code
      - name: Push branch
        run: |
          git push
      - name: Everparse CI
        run: |
          make -j$(nproc) -k test
      - name: Record hash
        run: |
          git rev-parse HEAD > hash.txt
      - name: Upload hash
        uses: actions/upload-artifact@v4
        with:
          path: |
            hash.txt
          name: hash

  create-pr:
    needs: [ci-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download base
        uses: actions/download-artifact@v4
        with:
          name: base
      - name: Download hash
        uses: actions/download-artifact@v4
        with:
          name: hash
      - name: Record hash and remove hash file
        run: |
          echo "updated_sha=$(cat hash.txt)" >> $GITHUB_ENV && rm hash.txt
          source base_ref.txt
          echo "base_branch=$base_branch" >> $GITHUB_ENV
          echo "base_sha=$base_sha" >> $GITHUB_ENV
          rm base_ref.txt
      - uses: actions/checkout@master
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ env.updated_sha }}
      - name: create pull request
        if: (github.event_name == 'schedule' && env.base_branch == 'master') || (github.event_name == 'workflow_dispatch' && inputs.create_pr)
        run: |
          if [[ "$updated_sha" != "$base_sha" ]] ; then git checkout -b _dzomo_pr_${{ github.run_id }} && git push --set-upstream origin _dzomo_pr_${{ github.run_id }} && gh pr create --base "$base_branch" --title "Update hashes and snapshots" --fill-verbose ; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Push to branch directly
        if: (github.event_name == 'schedule' && env.base_branch != 'master') || (github.event_name == 'workflow_dispatch' && !inputs.create_pr)
        run: |
          if [[ "$updated_sha" != "$base_sha" ]] ; then git push origin HEAD:"$base_branch" ; fi
      - name: Delete branch
        run: |
          if [[ "$(git rev-parse origin/_dzomo_upgrade_${{ github.run_id }})" = "$updated_sha" ]] ; then git push origin --delete _dzomo_upgrade_${{ github.run_id }} ; fi

  deps:
    runs-on: ubuntu-latest
    needs: create-pr
    steps:
      - name: Download hash
        uses: actions/download-artifact@v4
        with:
          name: hash
      - name: Record hash and remove hash file
        run: |
          echo "updated_sha=$(cat hash.txt)" >> $GITHUB_ENV && rm hash.txt
      - uses: actions/checkout@master
        with:
          submodules: true
          ref: ${{ env.updated_sha }}
          sparse-checkout: |
            .github/mark-deps-up-to-date.sh
            .github/prune-deps.sh
            Dockerfile
            deps.Makefile
            opt/Makefile
            opt/hashes.Makefile
            src/package/start-code-server.sh
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: deps.tgz
          key: dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }}
          lookup-only: true
          fail-on-cache-miss: false
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .git && docker build -t dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }} --pull --target deps .
      - name: Save image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker save dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }} | gzip > deps.tgz
      - name: Upload image into cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps.tgz
          key: dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }}
