name: Upgrade hashes, 3D doc, CBOR, COSE snapshots
on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a pull request (if unchecked, push directly to branch)'
        type: boolean
        default: true
      copilot_fix_attempts:
        description: 'How many times to let GitHub Copilot CLI try to fix a failing make command (0 to disable)'
        type: number
        default: 3
  schedule:
    - cron: "0 22 * * 0,3"

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  advance-hashes:
    runs-on: Ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - name: Record base ref
        run: |
          echo "base_branch=${{ github.event_name == 'schedule' && 'master' || github.ref_name }}" > base_ref.txt
          echo "base_sha=$(git rev-parse HEAD)" >> base_ref.txt
      - name: Upload base
        uses: actions/upload-artifact@v4
        with:
          path: |
            base_ref.txt
          name: base
      - name: Set up git
        run: |
          git config --global user.name "Dzomo, the Everest Yak"
          git config --global user.email "24394600+dzomo@users.noreply.github.com"
      - name: Advance hashes
        run: |
          make -C opt -j$(nproc) advance &&
          if ! git diff --exit-code -- opt/hashes.Makefile ; then git add -u opt/hashes.Makefile && git commit -m 'Update hashes' ; fi &&
          git diff --exit-code
      - name: Push new branch
        run: |
          git checkout -b _dzomo_upgrade_${{ github.run_id }} &&
          git push origin _dzomo_upgrade_${{ github.run_id }}

  deps-upgrade:
    runs-on: ubuntu-latest
    needs: advance-hashes
    steps:
      - uses: actions/checkout@master
        with:
          submodules: true
          ref: _dzomo_upgrade_${{ github.run_id }}
          sparse-checkout: |
            .github/mark-deps-up-to-date.sh
            .github/prune-deps.sh
            Dockerfile
            deps.Makefile
            opt/Makefile
            opt/hashes.Makefile
            src/package/start-code-server.sh

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: deps.tgz
          key: dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }}
          lookup-only: true
          fail-on-cache-miss: false

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .git && docker build -t dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }} --pull --target deps .

      - name: Save image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker save dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }} | gzip > deps.tgz

      - name: Upload image into cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps.tgz
          key: dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile', '.github/prune-deps.sh', '.github/mark-deps-up-to-date.sh') }}

  ci-linux:
    needs: deps-upgrade
    runs-on: ubuntu-latest
    env:
      COPILOT_FIX_ATTEMPTS: ${{ inputs.copilot_fix_attempts }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@master
        with:
          submodules: true
          ref: _dzomo_upgrade_${{ github.run_id }}
          path: everparse
      - uses: actions/cache/restore@v4
        with:
          path: deps.tgz
          key: dzomoeverparsedeps${{ hashFiles('everparse/opt/hashes.Makefile', 'everparse/Dockerfile', 'everparse/.github/prune-deps.sh', 'everparse/.github/mark-deps-up-to-date.sh') }}
      - name: Load deps image
        run: |
          { gunzip < deps.tgz | docker load ; } && rm deps.tgz
      - name: Upload EverParse in a container
        run: |
          container=$(docker run -d dzomoeverparsedeps${{ hashFiles('everparse/opt/hashes.Makefile', 'everparse/Dockerfile', 'everparse/.github/prune-deps.sh', 'everparse/.github/mark-deps-up-to-date.sh') }} "sleep infinity") && cd everparse && { tar c --exclude=./.git . | docker exec -i $container tar --overwrite -x ; } && docker exec $container bash .github/mark-deps-up-to-date.sh && { echo container=$container >> $GITHUB_ENV ; }
      - name: Set up git
        run: |
          git config --global user.name "Dzomo, the Everest Yak"
          git config --global user.email "24394600+dzomo@users.noreply.github.com"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot
      - name: Generate CBOR .krml files
        run: |
          bash everparse/.github/ci-make-with-copilot.sh cbor-extract-krml -kj$(nproc)
      - name: Generate CBOR snapshot with Karamel
        run: |
          bash everparse/.github/ci-make-with-copilot.sh cbor-snapshot -Otarget -kj$(nproc) &&
          bash everparse/.github/ci-make-with-copilot.sh cbor -kj$(nproc)
      - name: Generate COSE .krml files
        run: |
          bash everparse/.github/ci-make-with-copilot.sh cose-extract-krml -kj$(nproc)
      - name: Generate COSE snapshot with Karamel
        run: |
          bash everparse/.github/ci-make-with-copilot.sh cose-snapshot -Otarget -kj$(nproc) &&
          bash everparse/.github/ci-make-with-copilot.sh cose -kj$(nproc)
      - name: Generate 3D doc snapshot
        run: |
          bash everparse/.github/ci-make-with-copilot.sh 3d-doc-snapshot -kj$(nproc)
      - name: Commit and push Copilot fixes to the snapshot build
        run: |
          cd everparse && bash .github/commit-copilot-fixes.sh "Copilot: fix the snapshot build after the dependency upgrade"
      - name: Download new snapshots from the container
        run: |
          cd everparse &&
          rm -rf doc/3d-snapshot include/everparse src/cbor/pulse/det/c src/cbor/pulse/nondet/c src/cbor/pulse/det/rust src/cbor/pulse/nondet/rust src/cose/c src/cose/rust &&
          docker exec $container tar c doc/3d-snapshot include/everparse src/cbor/pulse/det/c src/cbor/pulse/nondet/c src/cbor/pulse/det/rust src/cbor/pulse/nondet/rust src/cose/c src/cose/rust | tar -x
      - name: Stage in new snapshots
        run: |
          cd everparse &&
          git add doc/3d-snapshot include/everparse src/cbor/pulse/det/c src/cbor/pulse/nondet/c src/cbor/pulse/det/rust src/cbor/pulse/nondet/rust src/cose/c src/cose/rust &&
          if ! git diff --staged --exit-code ; then git commit -m "3D doc, CBOR, COSE snapshot" ; fi &&
          git diff --exit-code
      - name: Push branch
        run: |
          cd everparse && git push
      - name: Everparse CI
        run: |
          bash everparse/.github/ci-make-with-copilot.sh -j$(nproc) -k test
      - name: Commit and push Copilot fixes to the test suite
        run: |
          cd everparse && bash .github/commit-copilot-fixes.sh "Copilot: fix the test suite after the dependency upgrade"
      - name: Remove container
        run: |
          docker stop $container && docker rm $container
      - name: Record hash
        run: |
          cd everparse && git rev-parse HEAD > ../hash.txt
      - name: Upload hash
        uses: actions/upload-artifact@v4
        with:
          path: |
            hash.txt
          name: hash

  create-pr:
    needs: [ci-linux]
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Download base
        uses: actions/download-artifact@v4
        with:
          name: base
      - name: Download hash
        uses: actions/download-artifact@v4
        with:
          name: hash
      - name: Record hash and remove hash file
        run: |
          echo "updated_sha=$(cat hash.txt)" >> $GITHUB_ENV && rm hash.txt
          source base_ref.txt
          echo "base_branch=$base_branch" >> $GITHUB_ENV
          echo "base_sha=$base_sha" >> $GITHUB_ENV
          rm base_ref.txt
          # Whether this run opens a pull request, resolved once here rather
          # than repeated as a GitHub expression on each step that needs it.
          if [[ "${{ github.event_name }}" == "schedule" && "$base_branch" == "master" ]] ||
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_pr }}" == "true" ]] ; then
            echo "creating_pr=true" >> $GITHUB_ENV
            # Describing those changes additionally needs Copilot credentials.
            if [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]] ; then
              echo "describe_with_copilot=true" >> $GITHUB_ENV
            fi
          fi
      - uses: actions/checkout@master
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ env.updated_sha }}
      - name: Set up Node
        if: env.describe_with_copilot == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        if: env.describe_with_copilot == 'true'
        run: |
          npm install -g @github/copilot
      - name: Describe the changes with Copilot
        if: env.describe_with_copilot == 'true'
        run: |
          if [[ "$updated_sha" != "$base_sha" ]] ; then bash .github/copilot-pr-description.sh "$base_sha" "$updated_sha" "$RUNNER_TEMP/pr-body.md" ; fi
      - name: create pull request
        if: env.creating_pr == 'true'
        run: |
          if [[ "$updated_sha" != "$base_sha" ]] ; then
            git checkout -b _dzomo_pr_${{ github.run_id }} &&
            git push --set-upstream origin _dzomo_pr_${{ github.run_id }} &&
            if test -s "$RUNNER_TEMP/pr-body.md" ; then
              gh pr create --base "$base_branch" --title "Update hashes and snapshots" --body-file "$RUNNER_TEMP/pr-body.md"
            else
              gh pr create --base "$base_branch" --title "Update hashes and snapshots" --fill-verbose
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Push to branch directly
        if: env.creating_pr != 'true'
        run: |
          if [[ "$updated_sha" != "$base_sha" ]] ; then git push origin HEAD:"$base_branch" ; fi
      - name: Delete branch
        run: |
          if [[ "$(git rev-parse origin/_dzomo_upgrade_${{ github.run_id }})" = "$updated_sha" ]] ; then git push origin --delete _dzomo_upgrade_${{ github.run_id }} ; fi
