name: Build everparse package (MacOS)
on:
  push:
    branches-ignore:
    - _**
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@master

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2

      - name: Install Homebrew tools
        run: |
          brew install bash gnu-getopt make gnu-time coreutils gmp libffi pkgconf sqlite

      - name: Build package
        run: |
          eval $(opam env)
          make -f package.Makefile everparse -kj$(sysctl -n hw.logicalcpu)

      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          path: |
            everparse
          name: everparse

  test:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download and extract artifact
        uses: actions/download-artifact@v4
        with:
          name: everparse
          path: ${{ github.workspace }}/test
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/3d/tests
            share/everparse/tests/3d
            src/cddl/tests/demo/test.cddl
          path: ${{ github.workspace }}/everparse
      - name: Test EverParse
        run: |
          bash ${{ github.workspace }}/test/everparse.sh ${{ github.workspace }}/everparse/src/3d/tests/Arithmetic.3d ${{ github.workspace }}/everparse/src/3d/tests/FieldDependence0.3d && bash ${{ github.workspace }}/test/everparse.sh ${{ github.workspace }}/everparse/src/3d/tests/Comments.3d && bash ${{ github.workspace }}/test/everparse.sh --check_hashes inplace ${{ github.workspace }}/everparse/src/3d/tests/Comments.3d
      # Same tests against the Pulse combinator backend. Two deliberate
      # differences from the Low* step above:
      #  - the inputs come from share/everparse/tests/3d rather than
      #    src/3d/tests, so that --check_hashes inplace, which rewrites the .3d
      #    file, does not clobber the hashes the Low* run just wrote.
      - name: Test EverParse (--pulse)
        run: |
          bash ${{ github.workspace }}/test/everparse.sh --pulse ${{ github.workspace }}/everparse/share/everparse/tests/3d/Arithmetic.3d ${{ github.workspace }}/everparse/share/everparse/tests/3d/FieldDependence0.3d && bash ${{ github.workspace }}/test/everparse.sh --pulse ${{ github.workspace }}/everparse/share/everparse/tests/3d/Comments.3d && bash ${{ github.workspace }}/test/everparse.sh --pulse --check_hashes inplace ${{ github.workspace }}/everparse/share/everparse/tests/3d/Comments.3d
      - name: Test EverParse test case generation
        run: |
          bash ${{ github.workspace }}/test/everparse.sh ${{ github.workspace }}/everparse/src/3d/tests/ELFTestGen.3d --odir ${{ github.workspace }}/test-elf --z3_test ELFTestGen._ELFTestGen --z3_witnesses 10 --z3_branch_depth 5
      # The --pulse counterpart. The generated C harness differs between the
      # two backends -- Pulse validators return a uint8_t status and report the
      # consumed length through a size_t* position -- so this compiles and runs
      # code the Low* step above never exercises. Its own --odir, so the two do
      # not clobber each other.
      - name: Test EverParse test case generation (--pulse)
        run: |
          bash ${{ github.workspace }}/test/everparse.sh --pulse ${{ github.workspace }}/everparse/share/everparse/tests/3d/ELFTestGen.3d --odir ${{ github.workspace }}/test-elf-pulse --z3_test ELFTestGen._ELFTestGen --z3_witnesses 10 --z3_branch_depth 5
      - name: Test EverCDDL
        run: |
          ${{ github.workspace }}/test/bin/cddl.exe ${{ github.workspace }}/everparse/src/cddl/tests/demo/test.cddl
